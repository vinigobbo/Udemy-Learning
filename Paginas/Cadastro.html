<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <nav>
            <h1>Estrutura basica de pagina web - HTML</h1>
            <p>
                <a href="Login.html">← Login</a>
            </p>
        </nav>    
    </header> 
    <hr>
    <main>
        <section>
            <h2>Cadastro</h2>
            <form action="processar.html" method="get">
                <b>Nome completo:</b> <br>
                <input type="text" name="nome" placeholder="Digite seu nome"> <br>
                <b>Email:</b> <br>
                <input type="email" name="email" placeholder="Digite seu email"> <br>
                <b>Telefone:</b> <br>
                <input type="tel" name="telefone" placeholder="Digite deu numero" size="10"> <br>
                <b>Data de nascimento:</b> <br>
                <input type="date" name="data" placeholder="Digite sua data de nascimento"> <br>
                <b>Genero:</b> <br>
                <input type="radio" name="genero">
                Masculino
                <input type="radio" name="genero">
                Feminino
                <input type="radio" name="genero">
                Outro <br>
                <b>Descrição:</b> <br>
                <textarea type="text" name="descrição" placeholder="Descrição" rows="5" cols="30"></textarea> <br>
                <b>Senha:</b> <br>
                <input type="password" name="senha" placeholder="Digite sua senha"> <br>
                <b>Confirmar Senha:</b> <br>
                <input type="password" name="consenha" placeholder="Digite sua senha"> <br>
                <input type="submit" value="Cadastrar">    
            </form>
        </section>
    </main>
</body>
</html>
