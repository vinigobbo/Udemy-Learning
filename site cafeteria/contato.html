    <link rel="stylesheet" href="estilo.css">

        <div class="contato">
            <h2>Cadastro</h2>

                <input type="text" name="nome" placeholder="Digite seu nome"> <br>

                <input type="email" name="email" placeholder="Digite seu email"> <br>
                <b>Descrição:</b> <br>
                <textarea type="text" name="descrição" placeholder="Descrição" rows="5" cols="30"></textarea> <br>
            </form>
        </div>
    </main>
    <footer>© 2026 CAFETERIA VIGO</footer>
